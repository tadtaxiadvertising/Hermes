version: '3.8'

services:
  # Honcho Memory Server - Self-hosted
  honcho:
    image: ghcr.io/plastic-labs/honcho:latest
    ports:
      - "8000:8000"
    environment:
      - HONCHO_API_KEY=hch-v3-1kjj7gyr465yswnyrwtjntx2ptbvebf90ty0otepc1h1q7tmpmuky3y44s69idhv
      - HONCHO_DATABASE_URL=postgresql://postgres:postgres@db:5432/honcho
      - HONCHO_REDIS_URL=redis://redis:6379/0
      - HONCHO_LOG_LEVEL=INFO
    volumes:
      - honcho-data:/data
    depends_on:
      - db
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=honcho
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Hermes Agent + Syncthing (existing)
  hermes:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - hermes-data:/data/hermes
      - syncthing-data:/data/syncthing
    environment:
      - HERMES_HOME=/data/hermes
      - HONCHO_URL=http://honcho:8000/
      - HONCHO_API_KEY=hch-v3-1kjj7gyr465yswnyrwtjntx2ptbvebf90ty0otepc1h1q7tmpmuky3y44s69idhv
      - HERMES_CRON_ENABLED=true
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_KEY_2=${NVIDIA_API_KEY_2}
      - NVIDIA_API_KEY_3=${NVIDIA_API_KEY_3}
      - NVIDIA_API_KEY_4=${NVIDIA_API_KEY_4}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
    command: >
      bash -c "
        set -e &&
        pip install --no-cache-dir hermes-agent[mcp] honcho-ai &&
        hermes profile create tad-shared &&
        hermes profile use tad-shared &&
        hermes memory setup honcho --non-interactive --url http://honcho:8000/ --apikey $${HONCHO_API_KEY} --workspace tad-dooh-platform &&
        hermes config set cron.enabled true &&
        tail -f /dev/null
      "
    depends_on:
      - honcho
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  syncthing:
    image: syncthing/syncthing:latest
    volumes:
      - syncthing-data:/var/syncthing
      - hermes-data:/data/hermes
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    environment:
      - STGUIADDRESS=0.0.0.0:8384
      - STHOMEDIR=/var/syncthing
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  honcho-data:
  postgres-data:
  redis-data:
  hermes-data:
  syncthing-data: