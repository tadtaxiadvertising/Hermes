# Docker Compose unificado para Easypanel - UN SOLO SERVICIO
# Actualiza tu servicio "hermes" existente con este archivo
# Configura en Easypanel: Settings → Git Repository → Branch: feat/dual-instance-honcho-sync
# Docker Compose file: docker-compose.easypanel.yml
# Target services: (todos - se levantan juntos)
# Auto Deploy: ON

version: '3.8'

services:
  # ============================================================
  # HONCHO MEMORY SERVER (PostgreSQL + Redis + Honcho)
  # ============================================================
  honcho-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=honcho
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - honcho-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d honcho"]
      interval: 10s
      timeout: 5s
      retries: 5

  honcho-redis:
    image: redis:7-alpine
    volumes:
      - honcho-redis-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  honcho:
    image: ghcr.io/plastic-labs/honcho:latest
    ports:
      - "8000:8000"
    environment:
      - HONCHO_API_KEY=${HONCHO_API_KEY:-hch-v3-1kjj7gyr465yswnyrwtjntx2ptbvebf90ty0otepc1h1q7tmpmuky3y44s69idhv}
      - HONCHO_DATABASE_URL=postgresql://postgres:postgres@honcho-db:5432/honcho
      - HONCHO_REDIS_URL=redis://honcho-redis:6379/0
      - HONCHO_LOG_LEVEL=INFO
    volumes:
      - honcho-data:/data
    depends_on:
      honcho-db:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # HERMES AGENT + SYNCTHING
  # ============================================================
  hermes:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - hermes-data:/data/hermes
      - syncthing-data:/data/syncthing
    environment:
      - HERMES_HOME=/data/hermes
      - HONCHO_URL=http://honcho:8000/
      - HONCHO_API_KEY=${HONCHO_API_KEY:-hch-v3-1kjj7gyr465yswnyrwtjntx2ptbvebf90ty0otepc1h1q7tmpmuky3y44s69idhv}
      - HERMES_CRON_ENABLED=true
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_KEY_2=${NVIDIA_API_KEY_2}
      - NVIDIA_API_KEY_3=${NVIDIA_API_KEY_3}
      - NVIDIA_API_KEY_4=${NVIDIA_API_KEY_4}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
    command: >
      bash -c "
        set -e &&
        pip install --no-cache-dir hermes-agent[mcp] honcho-ai &&
        hermes profile create tad-shared &&
        hermes profile use tad-shared &&
        hermes memory setup honcho --non-interactive --url http://honcho:8000/ --apikey $${HONCHO_API_KEY} --workspace tad-dooh-platform &&
        hermes config set cron.enabled true &&
        tail -f /dev/null
      "
    depends_on:
      honcho:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  syncthing:
    image: syncthing/syncthing:latest
    volumes:
      - syncthing-data:/var/syncthing
      - hermes-data:/data/hermes
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    environment:
      - STGUIADDRESS=0.0.0.0:8384
      - STHOMEDIR=/var/syncthing
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  honcho-postgres-data:
  honcho-redis-data:
  honcho-data:
  hermes-data:
  syncthing-data: